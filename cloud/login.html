<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070e16"><title>NULL / REBIRTH — Review Access</title><style>
:root{color-scheme:dark;--cyan:#70e2ec;--amber:#ffbf69;--muted:#809caa;--line:#264451}*{box-sizing:border-box}body{margin:0;background:#070e16;color:#dce9ee;font:14px/1.6 Arial,Helvetica,sans-serif;min-height:100svh;background-image:radial-gradient(ellipse at 50% 60%,#16334088,transparent 60%)}main{min-height:100svh;max-width:1440px;margin:auto;padding:32px 42px;display:flex;flex-direction:column}header{border-top:3px solid var(--cyan);border-bottom:1px solid var(--line);padding:18px 0;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;letter-spacing:3px}.brand b{color:var(--cyan);font-weight:400;margin:0 7px}.micro{font:10px/1.6 Consolas,monospace;color:var(--muted);letter-spacing:2px}.body{flex:1;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:100px;padding:55px 30px}.eyebrow{font:10px Consolas,monospace;letter-spacing:2.5px;color:var(--amber)}h1{font-size:clamp(44px,5.5vw,76px);line-height:1.02;letter-spacing:-3px;font-weight:400;margin:22px 0;color:#e1eef1}h1 span{color:var(--cyan)}.intro{font-size:14px;color:var(--muted);max-width:330px}.orb{width:210px;height:210px;position:relative;margin:35px 0 0;border:1px solid #305465;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 25px,#29505e33 26px),repeating-linear-gradient(90deg,transparent 0 25px,#29505e33 26px)}.orb:before{content:"";position:absolute;inset:20px;border:1px dashed #406d80;border-radius:50%}.orb:after{content:"";position:absolute;inset:52px;border:1px solid var(--cyan);transform:rotate(45deg)}.orb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cyan);font:22px Consolas,monospace;letter-spacing:4px}.gate{border:1px solid #365664;background:linear-gradient(135deg,#132b37cc,#091620);position:relative}.gate:before{content:"";position:absolute;width:9px;height:9px;top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}.gatehead{padding:16px 25px;border-bottom:1px solid var(--line);font:10px Consolas,monospace;letter-spacing:1.5px;color:var(--cyan);display:flex;justify-content:space-between}.gatebody{padding:32px 28px}h2{font-weight:400;font-size:25px;margin:0 0 28px}label{display:block;font:10px Consolas,monospace;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}input{background:#07121a;border:1px solid #365664;color:#e1eef1;font:16px Consolas,monospace;letter-spacing:2px;padding:16px;width:100%;border-radius:0}input:focus{outline:1px solid var(--cyan);border-color:var(--cyan)}button{margin-top:18px;padding:17px;background:var(--amber);border:1px solid var(--amber);width:100%;font:700 11px Consolas,monospace;letter-spacing:1.7px;display:flex;justify-content:space-between;color:#14232b;cursor:pointer}button:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}button:disabled{opacity:.5;cursor:wait}#message{font:11px/1.7 Consolas,monospace;color:#ff9293;min-height:19px;margin:17px 0 0}.access{margin-top:20px;font:9px Consolas,monospace;color:var(--muted);letter-spacing:1.2px;display:flex;justify-content:space-between}.access span:first-child{color:var(--cyan)}footer{display:flex;justify-content:space-between;font:9px Consolas,monospace;color:#597888;letter-spacing:1.5px}@media(max-width:850px){main{padding:20px}.body{gap:35px;padding:40px 0}.orb{width:150px;height:150px}h1{font-size:49px}.brand{font-size:19px}}@media(max-width:600px){.body{grid-template-columns:1fr;gap:30px;padding:34px 0}.orb,.intro{display:none}h1{font-size:43px;letter-spacing:-2px;margin-bottom:0}.micro{font-size:8px;letter-spacing:1px}.brand{font-size:16px;letter-spacing:2px}.gatebody{padding:24px}.gatehead{padding:14px 24px}footer{font-size:8px;letter-spacing:.5px}}
</style></head><body><main><header><div class="brand">NULL<b>/</b>REBIRTH</div><span class="micro">NR–110 / ACCESS CONTROL</span></header><section class="body"><div><div class="eyebrow">PROOF-CARRYING RESUME SYSTEM</div><h1>The command<br>bridge awaits.<br><span>Identify yourself.</span></h1><p class="intro">Evidence. Authority. Atomic resume.</p><div class="orb" aria-hidden="true"><span>NR / 01</span></div></div><div class="gate"><div class="gatehead"><span>REVIEW ACCESS</span><span>01 / AUTH</span></div><div class="gatebody"><h2>Enter the command bridge</h2><form id="login"><label for="review-key">REVIEW KEY</label><input id="review-key" name="review-key" type="password" autocomplete="off" placeholder="Enter your review key" required maxlength="256"><button id="submit" type="submit">AUTHORIZE ACCESS <span>↗</span></button><p id="message" role="status"></p></form><div class="access"><span>● SECURE SESSION</span><span>REVIEWER CHANNEL</span></div></div></div></section><footer><span>NULL / REBIRTH — COMMAND BRIDGE</span><span>v1.10 / AWS</span></footer></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message'),k=document.getElementById('review-key');b.disabled=true;m.textContent='';try{const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k.value})});k.value='';if(res.ok){location.replace('/');return;}m.textContent=res.status===410?'Review access has closed.':'Access denied. Check your review key.';}catch{m.textContent='Connection interrupted. Please try again.';}finally{b.disabled=false;}};window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
</script></body></html>
